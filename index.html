<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>LIFT · האימון שלי</title>
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIFT">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d10; --card:#15181d; --card2:#1c2027; --line:#262b33;
  --txt:#f2f4f7; --mut:#8b93a1; --acc:#c6ff3d; --acc2:#3dffb4; --warn:#ff8a3d; --red:#ff4d6d;
  --r:22px; --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'Rubik',system-ui,-apple-system,sans-serif;height:100%;overscroll-behavior:none}
body{padding-top:var(--safe-t)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.hide{display:none!important}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:18px 18px calc(100px + var(--safe-b))}
h1{font-size:30px;font-weight:900;letter-spacing:-.5px}
h2{font-size:20px;font-weight:700;margin:22px 0 12px}
.mut{color:var(--mut)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:17px;border-radius:18px;font-weight:700;font-size:17px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn-acc{background:var(--acc);color:#0b0d10;box-shadow:0 8px 30px -8px rgba(198,255,61,.55)}
.btn-ghost{background:var(--card2);border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--card2);font-size:13px;color:var(--mut)}
.chip.acc{background:rgba(198,255,61,.12);color:var(--acc)}
.logo{font-weight:900;font-size:15px;letter-spacing:3px;color:var(--acc)}

/* top header */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.streak{font-size:14px;color:var(--mut)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:24px;background:
 radial-gradient(120% 90% at 100% 0%,rgba(198,255,61,.22),transparent 60%),
 radial-gradient(90% 80% at 0% 100%,rgba(61,255,180,.14),transparent 60%),var(--card);border:1px solid var(--line)}
.hero .tag{font-size:13px;color:var(--acc);font-weight:700;letter-spacing:1px}
.hero h3{font-size:28px;font-weight:900;margin:8px 0 6px;line-height:1.15}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 0;text-align:center}
.wd b{display:block;font-size:13px;color:var(--mut);font-weight:500}
.wd span{display:block;margin-top:6px;font-weight:900;font-size:17px;height:22px}
.wd.on span{color:var(--acc)}
.wd.today{border-color:var(--acc)}
.wd.done{background:rgba(198,255,61,.12)}
.wd.done span::after{content:'✓';font-size:15px}
.wd.done span{font-size:0}

/* cardio progress */
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:99px;transition:width .5s}

/* plan list */
.plan-item{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.plan-item:last-child{border:0}
.num{width:34px;height:34px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.plan-item .nm{font-weight:500}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:10px 18px calc(10px + var(--safe-b));background:linear-gradient(transparent,var(--bg) 35%);z-index:5}
nav .in{display:flex;gap:6px;background:rgba(28,32,39,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:99px;padding:6px}
nav button{padding:11px 13px;border-radius:99px;font-size:14px;color:var(--mut);font-weight:500}
nav button.act{background:var(--acc);color:#0b0d10;font-weight:700}

/* onboarding */
.days-pick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0}
.days-pick button{aspect-ratio:1/1.25;border-radius:16px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.days-pick button small{font-size:10px;color:var(--mut);font-weight:400}
.days-pick button.sel{background:var(--acc);color:#0b0d10;border-color:var(--acc)}
.days-pick button.sel small{color:#0b0d10}
.preview .pi{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.preview .pi:last-child{border:0}

/* workout */
.wk-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.prog{display:flex;gap:4px;margin-bottom:22px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--card2)}
.prog i.d{background:var(--acc)}
.prog i.c{background:linear-gradient(90deg,var(--acc) 50%,var(--card2) 50%)}
.ex-title{font-size:27px;font-weight:900;line-height:1.2;margin:8px 0 6px}
.setdots{display:flex;gap:8px;margin:18px 0}
.setdots i{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-style:normal;font-weight:700;color:var(--mut)}
.setdots i.d{background:var(--acc);color:#0b0d10;border-color:var(--acc)}
.setdots i.c{border:2px solid var(--acc);color:var(--acc)}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 18px}
.stepper{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stepper label{font-size:12px;color:var(--mut)}
.stepper .ctl{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.stepper button{width:38px;height:38px;border-radius:12px;background:var(--card2);font-size:22px;font-weight:700}
.stepper input{width:64px;background:none;border:0;text-align:center;font-size:26px;font-weight:900;outline:none}
.last{font-size:13px;color:var(--mut);margin-top:-6px;margin-bottom:14px}
.next-up{margin-top:16px;padding:14px 16px;border-radius:18px;background:var(--card);border:1px dashed var(--line);font-size:14px;color:var(--mut)}
.next-up b{color:var(--txt);font-weight:500}

/* rest overlay */
#rest{position:fixed;inset:0;z-index:20;background:
 radial-gradient(80% 60% at 50% 30%,rgba(198,255,61,.12),transparent 70%),rgba(11,13,16,.98);
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px calc(30px + var(--safe-b));text-align:center}
#rest .lbl{font-size:14px;letter-spacing:3px;color:var(--acc);font-weight:700}
.ring{position:relative;width:min(74vw,300px);aspect-ratio:1;margin:24px 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(56px,18vw,82px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.ring.end .t{color:var(--acc);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.quote{font-size:20px;font-weight:700;max-width:340px;line-height:1.35;min-height:54px}
.rest-next{margin-top:12px;color:var(--mut);font-size:15px}
.rest-btns{display:flex;gap:10px;margin-top:28px;width:100%;max-width:380px}
.rest-btns .btn{padding:15px}
.ends-at{font-size:13px;color:var(--mut);margin-top:6px}

/* summary */
.big-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.big-stat div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 8px;text-align:center}
.big-stat b{display:block;font-size:24px;font-weight:900;color:var(--acc)}
.big-stat span{font-size:12px;color:var(--mut)}
.trophy{font-size:70px;text-align:center;margin-top:30px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}}

/* settings */
.set-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);gap:12px}
.set-row:last-child{border:0}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}
.seg button{padding:7px 11px;border-radius:9px;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#0b0d10;font-weight:700}
.tgl{width:52px;height:31px;border-radius:99px;background:var(--card2);position:relative;transition:.2s;flex:none}
.tgl::after{content:'';position:absolute;top:3px;right:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:.2s}
.tgl.on{background:var(--acc)}
.tgl.on::after{right:24px;background:#0b0d10}

.demo{position:relative;border-radius:22px;overflow:hidden;background:#fff;aspect-ratio:16/10;margin:2px 0 16px;border:1px solid var(--line)}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo img.f1{animation:flip 1.8s ease-in-out infinite}
@keyframes flip{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.demo .live{position:absolute;top:10px;right:10px;background:rgba(11,13,16,.75);color:var(--acc);font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;letter-spacing:1px;backdrop-filter:blur(6px)}
.demo.thumb{width:62px;height:46px;aspect-ratio:auto;border-radius:12px;margin:0;flex:none}
.demo.thumb .live{display:none}
.demo.paused img.f1{animation-play-state:paused}
#restDemo{width:min(78vw,320px);margin:0 0 4px}
#rest.has-demo .ring{width:min(46vw,190px);margin:14px 0}
#rest.has-demo .ring .t{font-size:clamp(40px,12vw,54px)}
.sh-in{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;border-top:1px solid var(--line);padding:22px 20px calc(24px + var(--safe-b));transform:translateY(100%);transition:transform .25s ease;max-width:520px;margin:0 auto}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);transition:opacity .25s;opacity:0}
#sheet.open{opacity:1}#sheet.open .sh-in{transform:none}
.sh-in::before{content:'';display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:-8px auto 14px}
.btn[disabled]{opacity:.5}
.spin{width:18px;height:18px;border:3px solid rgba(0,0,0,.25);border-top-color:#0b0d10;border-radius:50%;display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#scanfx{position:fixed;inset:0;z-index:40;background:#000;overflow:hidden;transition:opacity .35s}
#scanfx.out{opacity:0}
.sf-img{position:absolute;inset:0;background-size:cover;background-position:center;animation:zoom 6s ease-out forwards;filter:saturate(1.1)}
@keyframes zoom{to{transform:scale(1.12)}}
.sf-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(198,255,61,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(198,255,61,.08) 1px,transparent 1px);background-size:32px 32px;box-shadow:inset 0 0 120px 40px rgba(0,0,0,.7)}
.sf-laser{position:absolute;left:6%;right:6%;height:3px;background:var(--acc);box-shadow:0 0 18px 4px rgba(198,255,61,.8),0 0 60px 20px rgba(198,255,61,.25);animation:laser 1.8s ease-in-out infinite alternate;border-radius:9px}
@keyframes laser{from{top:14%}to{top:82%}}
.sf-c{position:absolute;width:44px;height:44px;border:4px solid var(--acc);animation:brk 1.2s ease-in-out infinite alternate}
.sf-c.tl{top:11%;right:5%;border-left:0;border-bottom:0;border-radius:0 14px 0 0}.sf-c.tr{top:11%;left:5%;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.sf-c.bl{bottom:15%;right:5%;border-left:0;border-top:0;border-radius:0 0 14px 0}.sf-c.br{bottom:15%;left:5%;border-right:0;border-top:0;border-radius:0 0 0 14px}
@keyframes brk{to{transform:scale(.92);opacity:.7}}
.sf-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--acc);opacity:0;animation:ping 2.4s ease-out infinite}
.sf-dot::after{content:'';position:absolute;inset:-10px;border:2px solid var(--acc);border-radius:50%}
@keyframes ping{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1)}60%{opacity:.8}100%{opacity:0;transform:scale(1.6)}}
.sf-msg{position:absolute;left:50%;bottom:calc(40px + var(--safe-b));transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(11,13,16,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:14px 22px;border-radius:99px;border:1px solid rgba(198,255,61,.35);white-space:nowrap;font-size:16px}
.sf-msg b.sw{animation:fade .35s ease}
.pop{opacity:0;animation:popin .45s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes popin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
#celebrate{position:fixed;inset:0;z-index:45;background:radial-gradient(90% 60% at 50% 30%,rgba(198,255,61,.14),transparent 70%),rgba(11,13,16,.97);opacity:0;transition:opacity .3s;overflow:hidden}
#celebrate.open{opacity:1}
.cb-in{max-width:420px;margin:0 auto;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 22px calc(24px + var(--safe-b));text-align:center}
.cb-food{width:92px;height:92px;border-radius:26px;object-fit:cover;border:3px solid var(--acc);box-shadow:0 10px 40px -10px rgba(198,255,61,.6);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.cb-chips{display:flex;gap:8px;margin:14px 0 4px;height:38px}
.fly{background:var(--card2);border:1px solid var(--line);padding:8px 14px;border-radius:99px;font-weight:700;opacity:0;animation:fly 1.3s cubic-bezier(.3,.7,.3,1) forwards}
.fly.acc{color:#0b0d10;background:var(--acc)}
@keyframes fly{0%{opacity:0;transform:translateY(-20px) scale(.6)}25%{opacity:1;transform:none}70%{opacity:1;transform:none}100%{opacity:0;transform:translateY(90px) scale(.5)}}
.cb-ring{position:relative;width:200px;height:200px;margin:8px 0}
.cb-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.cb-rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cb-rt b{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums}.cb-rt span{font-size:13px;color:var(--mut)}
.cb-pro{width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;font-variant-numeric:tabular-nums}
.cb-praise{opacity:0;transform:translateY(16px) scale(.9);transition:all .5s cubic-bezier(.2,1.5,.4,1);margin-top:18px;min-height:120px}
.cb-praise.show{opacity:1;transform:none}
.cb-emo{font-size:54px;line-height:1}.cb-praise.show .cb-emo{animation:wig .8s ease .2s}
@keyframes wig{25%{transform:rotate(-14deg) scale(1.2)}50%{transform:rotate(12deg) scale(1.2)}75%{transform:rotate(-6deg)}}
.cb-btn{opacity:0;transition:opacity .4s .3s}.cb-btn.show{opacity:1}
#confetti{position:absolute;inset:0;pointer-events:none}
#confetti i{position:absolute;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:110%;transform:rotate(720deg) translateX(40px)}}
.hist-item{padding:14px 0;border-bottom:1px solid var(--line)}
.hist-item:last-child{border:0}
.toast{position:fixed;top:calc(16px + var(--safe-t));left:50%;transform:translateX(-50%) translateY(-120px);background:var(--acc);color:#0b0d10;font-weight:700;padding:12px 20px;border-radius:99px;z-index:50;transition:.35s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" class="hide"><div class="in">
  <button data-go="home">🏠 בית</button>
  <button data-go="nutrition">🥗 תזונה</button>
  <button data-go="history">📈 היסטוריה</button>
  <button data-go="settings">⚙️ הגדרות</button>
</div></nav>

<div id="rest" class="hide">
  <div class="lbl" id="restLbl">מנוחה</div>
  <div id="restDemo"></div>
  <div class="ring" id="ring">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#1c2027" stroke-width="8"/>
    <circle id="ringC" cx="60" cy="60" r="54" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"/>
    <defs><linearGradient id="g"><stop offset="0" stop-color="#3dffb4"/><stop offset="1" stop-color="#c6ff3d"/></linearGradient></defs></svg>
    <div class="t" id="restT">1:30</div>
  </div>
  <div class="ends-at" id="endsAt"></div>
  <div class="quote" id="quote"></div>
  <div class="rest-next" id="restNext"></div>
  <div class="rest-btns">
    <button class="btn btn-ghost" id="minus15">‎−15</button>
    <button class="btn btn-ghost" id="plus15">‎+15</button>
    <button class="btn btn-acc" id="skipRest">יאללה ▶</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="scanfx" class="hide"></div><div id="celebrate" class="hide"></div>
<div id="sheet" class="hide"><div class="sh-in"></div></div>

<script>
/* ================= PROGRAM ================= */
const PROGRAM = [
  { id:'A', name:'חזה + יד אחורית', emoji:'💥', ex:[
    {id:'a1', m:'חזה', n:'לחיצת חזה בשיפוע חיובי עם משקולות יד', s:3},
    {id:'a2', m:'חזה', n:'לחיצת חזה בספסל שטוח', s:3, v:[['מוט','a2'],['מכונה','a2m']]},
    {id:'a3', m:'חזה', n:'פרפר בכבלים', s:3},
    {id:'a4', m:'יד אחורית', n:'פשיטת מרפק בעמידה בפולי עליון', s:4},
    {id:'a5', m:'יד אחורית', n:'פשיטת מרפק מאחורי העורף בפולי תחתון', s:3},
    {id:'ab1', m:'בטן', ab:1, n:'כפיפות בטן בכבל (קראנץ׳ בפולי עליון)', s:3},
    {id:'ab2', m:'בטן', ab:1, n:'הרמות רגליים', s:3, v:[['בתלייה','ab2'],['כיסא רומי','ab2c']]},
    {id:'ab3', m:'בטן', ab:1, n:'רוסיאן טוויסט', s:3},
    {id:'ab4', m:'בטן', ab:1, n:'פלאנק', s:3, t:45},
  ]},
  { id:'B', name:'גב + יד קדמית', emoji:'🦍', ex:[
    {id:'b1', m:'גב', n:'משיכה בפולי עליון – מוט רחב', s:3},
    {id:'b2', m:'גב', n:'חתירה בהאמר – אחיזה רחבה', s:3},
    {id:'b3', m:'גב', n:'פול אובר בפולי עליון', s:3},
    {id:'b4', m:'יד קדמית', n:'כפיפת מרפק', s:3, v:[['מכונה','b4'],['מוט','b4b']]},
    {id:'b5', m:'יד קדמית', n:'פטישים בעמידה עם משקולות יד', s:3},
    {id:'ab5', m:'בטן', ab:1, n:'כפיפות בטן במכונה', s:3},
    {id:'ab6', m:'בטן', ab:1, n:'הרמות ברכיים לחזה בכיסא רומי', s:3},
    {id:'ab7', m:'בטן', ab:1, n:'פלאנק צידי (כל צד)', s:3, t:30},
    {id:'ab8', m:'בטן', ab:1, n:'מטפס הרים', s:3, t:30},
  ]},

function beep(f=880,d=.12,v=.25){ if(!S.sound)return; const c=ac(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0,c.currentTime); g.gain.linearRampToValueAtTime(v,c.currentTime+.01);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+d+.02); }

/* ================= SCHEDULE ================= */
function doneOn(key){ return S.history.some(h=>h.day===key); }
function upcoming(n=7){ // predicted workouts for next n days
  const out=[]; let idx=S.next; const now=new Date();
  for(let i=0;i<n;i++){ const d=new Date(now); d.setDate(now.getDate()+i); const k=dayKey(d);
    const wd=d.getDay(); let w=null;
    if(i===0 && doneOn(k)){ const h=S.history.find(h=>h.day===k); w={wid:h.wid,done:true}; }
    else if(S.days.includes(wd)){ w={wid:PROGRAM[idx%3].id}; idx++; }
    out.push({d,wd,k,w}); }
  return out;
}
const W=id=>PROGRAM.find(p=>p.id===id);
function weekStart(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d; }
function cardioThisWeek(){ const ws=weekStart().getTime(); return S.cardio.filter(c=>c.t>=ws).reduce((a,c)=>a+c.min,0); }
function streak(){ // consecutive weeks with ≥1 workout
  let n=0; const ws=weekStart();
  for(let i=0;i<52;i++){ const a=new Date(ws); a.setDate(a.getDate()-7*i); const b=new Date(a); b.setDate(b.getDate()+7);
    const has=S.history.some(h=>h.t>=a&&h.t<b); if(has)n++; else if(i>0)break; }
  return n;
}

function finishSet(){

/* ================= REST TIMER ================= */
let REST=null, RAF=null;
function startRest(sec,label,nextTxt,onEnd,mode,exId){
  const isWalk=mode===true||mode==='walk', hold=mode==='hold';
  REST={end:Date.now()+sec*1000,total:sec*1000,nextTxt,onEnd,isWalk,hold,step:isWalk?300:hold?5:15,beeped:{},fired:false};
  $('#restLbl').textContent=label; $('#restNext').textContent=nextTxt;
  $('#quote').textContent=hold?'💪':QUOTES[Math.floor(Math.random()*QUOTES.length)];
  $('#skipRest').textContent=isWalk||hold?'סיימתי ✓':'יאללה ▶';
  $('#minus15').textContent=isWalk?'‎−5 דק׳':'‎−'+REST.step; $('#plus15').textContent=isWalk?'‎+5 דק׳':'‎+'+REST.step;
  $('#restDemo').innerHTML=exId?demo(exId):''; $('#rest').classList.toggle('has-demo',!!exId);
  $('#rest').classList.remove('hide'); $('#ring').classList.remove('end');
  clearInterval(RAF); RAF=setInterval(tick,200); tick();
  if(document.visibilityState!=='visible')notifyRest();
}
function adjRest(d){ if(!REST)return; const step=REST.step; REST.end+=d*step*1000; REST.total=Math.max(REST.total+d*step*1000,1000); REST.beeped={}; vib(10); tick(); }
function tick(){
  if(S.session){ const el=$('#elapsed'); if(el) el.textContent=fmt((Date.now()-S.session.start)/1000); }
  if(!REST)return;
  const left=(REST.end-Date.now())/1000;
  $('#restT').textContent=fmt(left);
  $('#endsAt').textContent='מסתיים ב-'+new Date(REST.end).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('#ringC').style.strokeDashoffset=339.3*(1-Math.max(0,left*1000)/REST.total);
  const s=Math.ceil(left);
  if(s<=3&&s>=1&&!REST.beeped[s]){ REST.beeped[s]=1; beep(740,.1,.2); vib(40); }
  if(left<=0&&!REST.fired){ REST.fired=true; $('#ring').classList.add('end'); beep(988,.35,.3); vib([200,80,200]); notifyGo();
    setTimeout(()=>{ if(REST&&REST.fired) closeRest(); },REST.isWalk?2500:900); }
}
function closeRest(){ const r=REST; REST=null; clearInterval(RAF); $('#rest').classList.add('hide');
  if(SWR&&SWR.getNotifications) SWR.getNotifications({tag:'rest'}).then(n=>n.forEach(x=>x.close())).catch(()=>{});
  if(r&&r.onEnd) r.onEnd(); }
$('#minus15').onclick=()=>adjRest(-1); $('#plus15').onclick=()=>adjRest(1);
$('#skipRest').onclick=()=>{ vib(15); closeRest(); };
setInterval(()=>{ if(S.session&&!REST){const el=$('#elapsed'); if(el) el.textContent=fmt((Date.now()-S.session.start)/1000);} },1000);

function targets(){
  const p=NT().profile; if(!p)return null;
  const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='f'?-161:5);
  const tdee=bmr*p.act;
  let kcal=p.goal==='cut'?Math.max(tdee-450,bmr*1.1):p.goal==='bulk'?tdee+250:tdee;
  kcal=Math.round(kcal/10)*10;
  const pro=Math.round(p.w*(p.goal==='cut'?2.0:1.8));
  const fat=Math.round(p.w*0.8);
  const carb=Math.max(0,Math.round((kcal-pro*4-fat*9)/4));
  return {kcal,pro,fat,carb,tdee:Math.round(tdee)};
}

const sum=(arr,f)=>Math.round(arr.reduce((a,x)=>a+(+x[f]||0),0));

function ringSvg(pct,size=150,stroke=12,col='url(#g2)'){

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)"><defs><linearGradient id="g2"><stop offset="0" stop-color="#3dffb4"/><stop offset="1" stop-color="#c6ff3d"/></linearGradient></defs>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#1c2027" stroke-width="${stroke}"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${pct>1?'#ff8a3d':col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}"/></svg>`;
}

     <div class="stepper"><label>מין</label><div class="seg" id="psx" style="margin-top:10px;justify-content:center"><button data-v="m" class="${p.sex!=='f'?'on':''}">זכר</button><button data-v="f" class="${p.sex==='f'?'on':''}">נקבה</button></div></div>
    </div>
    <div class="set-row"><div>פעילות יומית<div class="small mut">כולל אימונים</div></div><div class="seg" id="pact">${ACTS.map(a=>`<button data-v="${a[0]}" class="${a[0]==p.act?'on':''}">${a[1]}</button>`).join('')}</div></div>
    <div class="set-row"><div>מטרה</div><div class="seg" id="pg">${GOALS.map(g=>`<button data-v="${g[0]}" class="${g[0]===p.goal?'on':''}">${g[1]}</button>`).join('')}</div></div>
   </div>
   <div style="height:14px"></div>
   <button class="btn btn-acc" id="psave">חשב יעדים ✓</button>
   ${first?'':`<h2>מפתח סריקה (Gemini)</h2><div class="card small"><div class="row between"><span class="mut">${NT().key?'מחובר ✓':'לא מחובר'}</span><button class="chip acc" id="pkey">${NT().key?'החלף':'חבר'}</button></div></div>
   <div style="height:10px"></div><button class="btn" style="color:var(--mut)" id="pback">חזרה</button>`}
  </div>`;
  const segPick=(id)=>$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{$(id).querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
  ['#psx','#pact','#pg'].forEach(segPick);
  const val=id=>$(id).querySelector('.on').dataset.v;
  $('#psave').onclick=()=>{
    const np={w:parseFloat($('#pw').value),h:parseFloat($('#ph').value),age:parseInt($('#pa').value),sex:val('#psx'),act:parseFloat(val('#pact')),goal:val('#pg')};
    if(!(np.w>30&&np.h>120&&np.age>12)) return toast('מלא משקל, גובה וגיל');
    if(!NT().profile||NT().profile.w!==np.w) NT().weights.push({t:Date.now(),w:np.w});
    NT().profile=np; save(); const T=targets(); toast(`יעד: ${T.kcal} קק״ל · ${T.pro} ג׳ חלבון`); nutritionView();
  };
  const k=$('#pkey'); if(k) k.onclick=()=>keySheet(()=>profileForm(false));
  const bk=$('#pback'); if(bk) bk.onclick=nutritionView;
}

/* ---- bottom sheet ---- */
function sheet(html){ const el=$('#sheet'); el.querySelector('.sh-in').innerHTML=html; el.classList.remove('hide'); requestAnimationFrame(()=>el.classList.add('open')); return el; }
function closeSheet(){ const el=$('#sheet'); el.classList.remove('open'); setTimeout(()=>el.classList.add('hide'),250); }
document.addEventListener('click',e=>{ if(e.target.id==='sheet') closeSheet(); });

function keySheet(after){
  sheet(`<h2 style="margin-top:0">חיבור סריקת אוכל 🤖</h2>
   <p class="small mut" style="line-height:1.7">הסריקה משתמשת ב-Gemini של גוגל – <b style="color:var(--txt)">בחינם</b>, בלי כרטיס אשראי. פעם אחת בלבד:</p>
   <ol class="small" style="line-height:1.9;padding-right:18px;margin:10px 0">
    <li>היכנס ל-<a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--acc)">aistudio.google.com/apikey</a> עם חשבון גוגל</li>
    <li>לחץ <b>Create API key</b> והעתק את המפתח</li>
    <li>הדבק כאן 👇</li></ol>
   <input id="kin" placeholder="AIza..." value="${NT().key}" style="width:100%;padding:14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);direction:ltr;outline:none">
   <p class="small mut" style="margin-top:8px">המפתח נשמר רק בטלפון שלך.</p>
   <div style="height:12px"></div><button class="btn btn-acc" id="ksave">שמור</button>`);
  $('#ksave').onclick=()=>{ const v=$('#kin').value.trim(); if(v.length<20) return toast('מפתח לא תקין'); NT().key=v; save(); closeSheet(); toast('מחובר ✓'); after&&after(); };
}

async function shrink(file,max=1024,q=.8){
  const url=URL.createObjectURL(file); const img=new Image(); img.src=url; await img.decode();
  const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
  c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const t=document.createElement('canvas'); const ts=96/Math.max(c.width,c.height); t.width=c.width*ts; t.height=c.height*ts; t.getContext('2d').drawImage(c,0,0,t.width,t.height);
  URL.revokeObjectURL(url); return {b64:c.toDataURL('image/jpeg',q).split(',')[1],thumb:t.toDataURL('image/jpeg',.6),full:c.toDataURL('image/jpeg',.7)};
}

const AI_PROMPT=`אתה תזונאי ספורט מומחה. זהה כל מאכל ושתייה בתמונה, הערך את המשקל בגרמים לפי גודל הצלחת, הכלים והפרופורציות, וחשב ערכים תזונתיים מבוססי טבלאות תזונה סטנדרטיות.
החזר JSON בלבד בפורמט:
{"items":[{"name":"שם קצר בעברית","grams":0,"kcal":0,"protein":0,"carbs":0,"fat":0}],"confidence":"גבוה|בינוני|נמוך","tip":"טיפ קצר אחד בעברית למי שבחיטוב ורוצה יותר חלבון"}
מספרים שלמים בלבד. אם אין אוכל – items ריק.`;
async function askAI(parts){
  const models=['gemini-flash-latest','gemini-2.5-flash','gemini-2.0-flash'];
  let lastErr='';
  for(const m of models){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(NT().key)}`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json',temperature:.2}})});
    if(r.status===404){lastErr='model';continue;}
    const j=await r.json();
    if(!r.ok){ if(r.status===400&&/API key/i.test(JSON.stringify(j))) throw new Error('key'); if(r.status===429) throw new Error('quota'); throw new Error(j.error&&j.error.message||'err'); }
    const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
    return JSON.parse(txt.replace(/```json|```/g,'').trim());
  }
  throw new Error(lastErr||'err');
}
const AIERR=e=>e.message==='key'?'המפתח לא תקין – בדוק בפרופיל':e.message==='quota'?'הגעת למכסה החינמית לרגע – נסה שוב בעוד דקה':!navigator.onLine?'אין חיבור לאינטרנט':'הסריקה נכשלה – נסה שוב';

async function scanSheet(file){
  const im=await shrink(file);
  sheet(`<img src="${im.full}" style="width:100%;max-height:260px;object-fit:cover;border-radius:18px">
    <input id="hint" placeholder="הערה (לא חובה): למשל ״200 גרם חזה עוף״" style="width:100%;margin-top:12px;padding:14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);outline:none">
    <div style="height:12px"></div><button class="btn btn-acc" id="go">🤖 נתח ארוחה</button>`);
  $('#go').onclick=async()=>{
    const hint=$('#hint').value.trim();
    closeSheet(); const stop=scanFx(im.full); const t0=Date.now();
    try{
      const res=await askAI([{text:AI_PROMPT+(hint?`\nהערת המשתמש: ${hint}`:'')},{inline_data:{mime_type:'image/jpeg',data:im.b64}}]);
      await new Promise(r=>setTimeout(r,Math.max(0,2600-(Date.now()-t0))));
      stop(); vib([20,30,20]); beep(880,.1,.12); resultSheet(res,im.thumb,true);
    }catch(e){ stop(); toast(AIERR(e)); }
  };
}

function resultSheet(res,thumb,anim){
  let items=(res.items||[]).map(x=>({...x,on:true})); let mult=1; let first=true;
  const draw=()=>{ const A=first&&anim!==false;
    const on=items.filter(x=>x.on), t=k=>Math.round(on.reduce((a,x)=>a+(+x[k]||0),0)*mult);
    sheet(`<div class="row" style="gap:12px">${thumb?`<img src="${thumb}" style="width:64px;height:64px;border-radius:16px;object-fit:cover">`:''}
      <div><div class="small mut">זוהה · ודאות ${res.confidence||'—'}</div><b style="font-size:26px;font-weight:900"><span data-cnt="${t('kcal')}">${A?0:t('kcal')}</span> קק״ל</b></div></div>
     <div class="big-stat" style="margin:14px 0"><div class="${A?'pop':''}" style="animation-delay:.1s"><b data-cnt="${t('protein')}">${A?0:t('protein')}</b><span>ג׳ חלבון</span></div><div class="${A?'pop':''}" style="animation-delay:.2s"><b style="color:#5aa9ff" data-cnt="${t('carbs')}">${A?0:t('carbs')}</b><span>פחמימות</span></div><div class="${A?'pop':''}" style="animation-delay:.3s"><b style="color:#ffb43d" data-cnt="${t('fat')}">${A?0:t('fat')}</b><span>שומן</span></div></div>
     ${items.length?items.map((x,i)=>`<div class="row between hist-item ${A?'pop':''}" data-tg="${i}" style="${A?`animation-delay:${.45+i*.22}s;`:''}${x.on?'':'opacity:.35'}"><div><b style="font-weight:500">${x.on?'✓':'○'} ${x.name}</b><div class="small mut">~${Math.round(x.grams*mult)} ג׳ · ${Math.round(x.kcal*mult)} קק״ל · ${Math.round(x.protein*mult)} ג׳ חלבון</div></div></div>`).join(''):'<p class="mut">לא זוהה אוכל בתמונה 🤔</p>'}
     <div class="set-row"><div>גודל מנה</div><div class="seg" id="mul">${[.5,.75,1,1.25,1.5,2].map(m=>`<button data-m="${m}" class="${m===mult?'on':''}">×${m}</button>`).join('')}</div></div>
     ${res.tip?`<div class="next-up" style="margin-top:6px">💡 ${res.tip}</div>`:''}
     <div style="height:12px"></div><button class="btn btn-acc" id="addm" ${on.length?'':'disabled'}>+ הוסף לארוחת ${mealName()}</button>`);
    if(A){ $('#sheet').querySelectorAll('[data-cnt]').forEach(el=>countUp(el,0,+el.dataset.cnt,1300)); }
    first=false;
    $('#sheet').querySelectorAll('[data-tg]').forEach(r=>r.onclick=()=>{items[+r.dataset.tg].on=!items[+r.dataset.tg].on;draw();});
    $('#mul').querySelectorAll('button').forEach(b=>b.onclick=()=>{mult=+b.dataset.m;draw();});
    $('#addm').onclick=()=>{ addFood({name:on.map(x=>x.name).join(', '),kcal:t('kcal'),p:t('protein'),c:t('carbs'),f:t('fat'),img:thumb}); closeSheet(); };
  };
  draw();
}
function addFood(x){ const k=todayKey(); const L0=dayLog(); const prev={k:sum(L0,'kcal'),p:sum(L0,'p')};
  (NT().log[k]=NT().log[k]||[]).push({...x,meal:mealName(),t:Date.now()}); save(); vib(20);
  const L=dayLog(); celebrate(prev,{k:sum(L,'kcal'),p:sum(L,'p')},{kcal:Math.round(x.kcal),p:Math.round(x.p),img:x.img}); }

function manualSheet(){
  const fld=(id,l,m='numeric')=>`<div class="stepper"><label>${l}</label><input id="${id}" inputmode="${m}" style="width:100%;margin-top:6px;font-size:20px"></div>`;
  sheet(`<h2 style="margin-top:0">הוספה ידנית</h2>
    <input id="mn" placeholder="מה אכלת? למשל: 2 ביצים, טוסט ו-קוטג׳" style="width:100%;padding:14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);outline:none">
    <button class="btn btn-ghost" id="mai" style="margin-top:10px;padding:13px;font-size:15px">🤖 חשב לי אוטומטית</button>
    <div class="inputs" style="margin-top:12px">${fld('mk','קלוריות')}${fld('mp','חלבון (ג׳)')}${fld('mc','פחמימות (ג׳)')}${fld('mf','שומן (ג׳)')}</div>
    <button class="btn btn-acc" id="madd">+ הוסף</button>`);
  $('#mai').onclick=async()=>{
    const n=$('#mn').value.trim(); if(!n) return toast('כתוב מה אכלת');
    if(!NT().key) return keySheet(manualSheet);
    $('#mai').textContent='מחשב…';
    try{ const r=await askAI([{text:AI_PROMPT+`\nאין תמונה. המשתמש כתב מה אכל: ${n}`}]); resultSheet(r,null); }
    catch(e){ toast(AIERR(e)); $('#mai').textContent='🤖 חשב לי אוטומטית'; }
  };
  $('#madd').onclick=()=>{ const n=$('#mn').value.trim()||'ארוחה'; const k=+$('#mk').value||0; if(!k&&!+$('#mp').value) return toast('מלא קלוריות או חלבון');
    addFood({name:n,kcal:k,p:+$('#mp').value||0,c:+$('#mc').value||0,f:+$('#mf').value||0}); closeSheet(); };
}

/* ================= SCAN / CELEBRATION FX ================= */
const ease=t=>1-Math.pow(1-t,3);
function countUp(el,from,to,dur=1200,suffix=''){ if(!el)return; const st=performance.now();
  const f=now=>{const t=Math.min(1,(now-st)/dur); el.textContent=Math.round(from+(to-from)*ease(t))+suffix; if(t<1) requestAnimationFrame(f);}; requestAnimationFrame(f); }
const SCAN_MSG=['מזהה מאכלים בצלחת…','מעריך גודל מנה…','סופר חלבונים 🥩','מחשב קלוריות 🔥','כמעט מוכן…'];
function scanFx(img){
  const el=$('#scanfx'); el.innerHTML=`<div class="sf-img" style="background-image:url(${img})"></div><div class="sf-grid"></div><div class="sf-laser"></div>
   <div class="sf-c tl"></div><div class="sf-c tr"></div><div class="sf-c bl"></div><div class="sf-c br"></div>
   ${[...Array(7)].map((_,i)=>`<i class="sf-dot" style="top:${20+Math.random()*55}%;left:${12+Math.random()*70}%;animation-delay:${i*.35}s"></i>`).join('')}
   <div class="sf-msg"><span class="spin" style="border-color:rgba(198,255,61,.25);border-top-color:var(--acc)"></span><b id="sfm">${SCAN_MSG[0]}</b></div>`;
  el.classList.remove('hide'); let i=0; const iv=setInterval(()=>{i=(i+1)%SCAN_MSG.length; const m=$('#sfm'); if(m){m.classList.remove('sw');void m.offsetWidth;m.classList.add('sw');m.textContent=SCAN_MSG[i];}},1300);
  vib(15);
  return ()=>{clearInterval(iv); el.classList.add('out'); setTimeout(()=>{el.classList.add('hide');el.classList.remove('out');el.innerHTML='';},350);};
}
function praise(meal,tot,T,prevP){
  const proShare=meal.kcal?meal.p*4/meal.kcal:0;
  if(prevP<T.pro&&tot.p>=T.pro) return ['🏆','יעד החלבון של היום הושג!','השרירים שלך מודים לך. ככה בונים גוף חטוב.'];
  if(tot.k>T.kcal*1.05) return ['⚖️','עברת קצת את יעד הקלוריות','לא נורא בכלל – מחר מאזנים. עקביות מנצחת.'];
  if(meal.p>=35) return ['💪','מכונת חלבון!',`${meal.p} גרם חלבון בארוחה אחת – בדיוק מה שהחיטוב צריך.`];
  if(proShare>=.3) return ['🔥','ארוחת חיטוב מושלמת','הרבה חלבון, מעט קלוריות. ככה החזה והבטן מתחילים לצאת.'];
  if(meal.p>=20) return ['👊','ארוחה טובה!',`עוד ${Math.max(0,T.pro-tot.p)} גרם חלבון והיום סגור.`];
  return ['👍','נרשם!',`שווה להוסיף מקור חלבון בארוחה הבאה – חסרים ${Math.max(0,T.pro-tot.p)} גרם.`];
}
function celebrate(prev,tot,meal){
  const T=targets(); const el=$('#celebrate'); const [emo,title,sub]=praise(meal,tot,T,prev.p);
  const C=2*Math.PI*80, off=v=>C*(1-Math.min(1,v/T.kcal));
  el.innerHTML=`<div class="cb-in">
    ${meal.img?`<img src="${meal.img}" class="cb-food">`:`<div class="cb-food" style="display:grid;place-items:center;font-size:40px;background:var(--card2)">🍽</div>`}
    <div class="cb-chips"><span class="fly" style="animation-delay:.2s">+<b id="cbk">0</b> קק״ל</span><span class="fly acc" style="animation-delay:.45s">+<b id="cbp">0</b> ג׳ חלבון</span></div>
    <div class="cb-ring"><svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="80" fill="none" stroke="#1c2027" stroke-width="14"/>
      <circle id="cbr" cx="90" cy="90" r="80" fill="none" stroke="${tot.k>T.kcal?'#ff8a3d':'url(#g3)'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off(prev.k)}"/>
      <defs><linearGradient id="g3"><stop offset="0" stop-color="#3dffb4"/><stop offset="1" stop-color="#c6ff3d"/></linearGradient></defs></svg>
      <div class="cb-rt"><b id="cbtk">${prev.k}</b><span>מתוך ${T.kcal} קק״ל</span></div></div>
    <div class="cb-pro"><div class="row between small"><span>🥩 חלבון היום</span><b><span id="cbtp">${prev.p}</span> / ${T.pro} ג׳</b></div>
      <div class="bar" style="height:14px;margin-top:8px"><i id="cbpb" style="width:${Math.min(100,prev.p/T.pro*100)}%;transition:width 1.4s cubic-bezier(.2,.8,.2,1) .9s"></i></div></div>
    <div class="cb-praise"><div class="cb-emo">${emo}</div><h2 style="margin:6px 0 4px">${title}</h2><p class="mut">${sub}</p></div>
    <button class="btn btn-acc cb-btn">מעולה ✓</button></div><div id="confetti"></div>`;
  el.classList.remove('hide'); requestAnimationFrame(()=>el.classList.add('open'));
  countUp($('#cbk'),0,meal.kcal,900); countUp($('#cbp'),0,meal.p,900);
  setTimeout(()=>{ $('#cbr').style.transition='stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)'; $('#cbr').style.strokeDashoffset=off(tot.k);
    countUp($('#cbtk'),prev.k,tot.k,1400); countUp($('#cbtp'),prev.p,tot.p,1400); $('#cbpb').style.width=Math.min(100,tot.p/T.pro*100)+'%';
    beep(660,.08,.12); },900);
  setTimeout(()=>{ el.querySelector('.cb-praise').classList.add('show'); el.querySelector('.cb-btn').classList.add('show');
    const good=tot.k<=T.kcal*1.05; if(good){ confetti(); beep(784,.12,.15); setTimeout(()=>beep(1046,.2,.15),130); vib([30,40,60]); } },2300);
  el.querySelector('.cb-btn').onclick=()=>{ el.classList.remove('open'); setTimeout(()=>{el.classList.add('hide');el.innerHTML='';},300); if(VIEW==='nutrition') nutritionView(); else render(); };
}
function confetti(){ const c=$('#confetti'); if(!c)return; const cols=['#c6ff3d','#3dffb4','#ff8a3d','#5aa9ff','#fff'];
  c.innerHTML=[...Array(60)].map(()=>`<i style="left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*5)]};animation-delay:${Math.random()*.4}s;animation-duration:${1.6+Math.random()*1.4}s;transform:rotate(${Math.random()*360}deg);width:${6+Math.random()*6}px;height:${10+Math.random()*8}px"></i>`).join(''); }

/* resume a running workout after reload */
if(S.session) wakeOn();
render();
</script>
